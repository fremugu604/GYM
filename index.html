  if(!tot)return{tot:0,bad:false,msg:""};
  if(tot>T*(g==="ganar"?1.2:1.1))msg="Te pasaste de tu meta: "+tot+" kcal consumidas contra "+T+" kcal. "+(g==="perder"?"Con exceso no hay déficit y tu pérdida de grasa se frena.":g==="ganar"?"Un exceso grande se convierte más en grasa que en músculo.":"Un exceso constante te hace subir de peso.");
  else if(past&&tot<T*0.6)msg="Comiste muy poco: "+tot+" kcal contra tu meta de "+T+" kcal. Comer tan poco baja tu energía, puede hacerte perder músculo y frena tu progreso.";
  else if(past&&g==="ganar"&&tot<T*0.85)msg="Quedaste por debajo de tu meta para ganar músculo ("+tot+" de "+T+" kcal). Sin suficientes calorías el músculo no crece.";
  return{tot:tot,bad:!!msg,msg:msg}}
function calCard(k){var c=cm(k),off=(new Date(c.y,c.m,1).getDay()+6)%7,n=new Date(c.y,c.m+1,0).getDate(),t=dk();
  var h='<div class="card"><h3>'+(k==="h"?"Asistencia al gym":"Calorías por día")+'</h3><div class="cal-h"><span class="chip" onclick="calNav(\''+k+'\',-1)">‹</span><b>'+MES[c.m]+' '+c.y+'</b><span class="chip" onclick="calNav(\''+k+'\',1)">›</span></div><div class="cal">'+["L","M","M","J","V","S","D"].map(function(x){return'<div class="cdh">'+x+'</div>'}).join("");
  for(var i=0;i<off;i++)h+='<div></div>';
  for(var d=1;d<=n;d++){var key=c.y+"-"+p2(c.m+1)+"-"+p2(d),cls="cd"+(key===t?" today":""),inner;
    if(k==="h"){var st=gymState(key);inner='<b>'+d+'</b><em>'+(st==="ok"?"✅":st==="miss"?"❌":"")+'</em>'}
    else{var ms=key<=t?mealStatus(key):{tot:0,bad:false};if(ms.bad)cls+=" red";inner='<b>'+d+'</b><span>'+(ms.tot?ms.tot:"")+'</span>'}
    h+='<div class="'+cls+'" onclick="calTap(\''+k+'\',\''+key+'\')">'+inner+'</div>'}
  return h+'</div><div class="mute" style="margin-top:8px">'+(k==="h"?"✅ asististe · ❌ no asististe. Toca un día para ver el detalle.":"Los días en rojo están fuera de tu meta. Toca un día para ver por qué.")+'</div></div>'}
function calTap(k,key){
  if(k==="h"){var l=S.log[key],st=gymState(key),h='<h3>'+key+'</h3>';
    if(st==="ok")h+='<p>✅ Asististe. '+(l.routine?'Rutina: '+esc(l.routine)+'. ':'')+l.done.length+' ejercicios completados.</p>';
    else if(st==="miss")h+='<p>❌ No asististe.</p><p>'+(l&&l.reason?'Motivo: '+esc(l.reason):'No registraste el motivo.')+'</p><p class="mute">Cada sesión perdida atrasa tu meta unos '+Math.round(7/daysPerWeek())+' días.</p>'+(l&&l.reason?'':'<button class="btn" onclick="reasonFor(\''+key+'\')">Registrar motivo</button>');
    else h+='<p class="mute">'+(key>=dk()?"Aún no hay registro para este día.":"Día de descanso.")+'</p>';
    modal(h+'<button class="btn alt" onclick="closeM()">Cerrar</button>');return}
  var ms=key<=dk()?mealStatus(key):{tot:0,bad:false,msg:""},list=(S.meals[key]||[]).map(function(m){return'<div>'+esc(m.slot)+': '+esc(m.name)+' · '+m.kcal+' kcal</div>'}).join("");
  modal('<h3>'+key+'</h3><p><b>'+ms.tot+'</b> / '+target()+' kcal</p>'+(ms.bad?'<p style="color:var(--red)">'+ms.msg+'</p>':(ms.tot?'<p>Dentro de tu meta. ¡Bien!</p>':'<p class="mute">Sin comidas registradas.</p>'))+'<div class="mute">'+list+'</div><button class="btn alt" onclick="closeM()">Cerrar</button>')}
var snooze={};
function checkPrompts(){
  if(!S.p||$("#modal").innerHTML)return;
  var bn=new Date();
  if(S.p.b&&S.p.b.slice(5)===dk().slice(5)&&S.p.bmsg!==bn.getFullYear()){
    S.p.bmsg=bn.getFullYear();save();
    try{if("Notification"in window&&Notification.permission==="granted")new Notification("¡Feliz cumpleaños!",{body:"Hoy cumples "+ageOf(S.p)+" años. ¡Sigue con tus metas fit!"})}catch(e){}
    modal('<h2>🎉 ¡Feliz cumpleaños!</h2><p>Hoy cumples <b>'+ageOf(S.p)+'</b> años. Cada entreno y cada comida que registras es un regalo para tu yo del futuro.</p><p>Sigue adelante: lo estás haciendo muy bien y lo mejor de tu camino fit apenas empieza. ¡Disfruta tu día y a por tus metas!</p><button class="btn" onclick="closeM()">¡Gracias!</button>');return}
  var m=missed();if(m.length){reasonFor(m[0]);return}
  var now=new Date(),hr=now.getHours(),k=dk(),ms=mealsToday(),sk=S.skip[k]||[];
  for(var i=0;i<SLOTS.length;i++){var s=SLOTS[i];
    if(hr>=s[1]&&hr<s[1]+3&&!ms.some(function(x){return x.slot===s[0]})&&sk.indexOf(s[0])<0&&!(snooze[s[0]]>Date.now())){
      snooze[s[0]]=Date.now()+30*60000;
      try{if("Notification"in window&&Notification.permission==="granted")new Notification("FitRutina",{body:"¿Qué desayunaste/comiste? Registra tu "+s[0].toLowerCase()})}catch(e){}
      modal('<h3>'+s[0]+'</h3><p>Es hora de registrar lo que comiste.</p><button class="btn" onclick="addMeal(\''+s[0]+'\')">Registrar ahora</button><button class="btn alt" onclick="closeM()">Más tarde</button>');return}
  }
  var wg=waterGoal(),wexp=wg*Math.min(1,Math.max(0,(hr-8)/13));
  if(hr>=9&&hr<=21&&wToday()<wexp-250&&!(snooze.water>Date.now())){
    snooze.water=Date.now()+120*60000;
    try{if("Notification"in window&&Notification.permission==="granted")new Notification("FitRutina",{body:"Es hora de tomar agua"})}catch(e){}
    modal('<h3>💧 Hora de tomar agua</h3><p>Llevas '+wToday()+' ml de tu meta de '+wg+' ml.</p><button class="btn" onclick="addWater(250);closeM()">Ya tomé un vaso</button><button class="btn alt" onclick="closeM()">Más tarde</button>');return}
  var rt=(S.p.rt||"18:00").split(":"),isDay=S.p.days.indexOf(now.getDay())>-1,l=S.log[k];
  if(isDay&&!(l&&l.finished)&&(hr*60+now.getMinutes()>=+rt[0]*60+ +rt[1])&&!(snooze.gym>Date.now())){
    snooze.gym=Date.now()+60*60000;
    modal('<h3>Hora de entrenar</h3><p>Hoy toca rutina. Un entreno más te acerca a tu meta.</p><button class="btn" onclick="closeM();go(\'hoy\')">Empezar</button><button class="btn alt" onclick="closeM()">Después</button>');
  }
}
load();render();
try{if(S.p&&"Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
setTimeout(checkPrompts,800);setInterval(checkPrompts,60000);
</script>
