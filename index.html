html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif;padding-bottom:78px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0;letter-spacing:.2px}
h1{font-size:34px}h2{font-size:26px}h3{font-size:21px}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.mute{color:var(--mute);font-size:14px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:600 17px Barlow,sans-serif;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:14px;color:var(--ink)}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mute);font:600 13px Barlow,sans-serif}
nav button.on{color:var(--acc)}
.ex{border-left:5px solid var(--line)}
.ex.cur{border-left-color:var(--acc)}
.ex.done{border-left-color:var(--ok);opacity:.55}
.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:42px;font-weight:700;line-height:1}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.over i{background:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal>div{max-height:88vh;overflow:auto;background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
a{color:var(--acc)}
.row{display:flex;gap:10px}.row>*{flex:1}
.figs{display:flex;gap:8px;margin:8px 0}.figs>div{flex:1;text-align:center;font-size:13px;color:var(--mute)}
.f{width:100%;height:auto;background:var(--bg);border-radius:10px}
.f line,.f polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.f .sk{stroke:#E0AC82}.f .sh{stroke:#2B3140}.f .tp{stroke:var(--acc)}.f .wh{stroke:#F4F4F4}.f .far{filter:brightness(.7)}.f .e{stroke:var(--mute);stroke-width:3}.f .fl{stroke:var(--line);stroke-width:2}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cdh{text-align:center;font-size:12px;color:var(--mute)}
.cd{border:1px solid var(--line);border-radius:8px;min-height:46px;padding:3px 0;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.cd b{font-size:13px;color:var(--ink)}.cd em{font-style:normal;font-size:16px}.cd.today{border:2px solid var(--acc)}.cd.red,.cd.red b{color:var(--red);font-weight:700}.cd.red{border-color:var(--red)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

function bItem(b){return b.m?{name:b.name,por:"porción",kcal:b.kcal}:{name:FOODS[b.i][0],por:FOODS[b.i][1],kcal:FOODS[b.i][2]}}
function fbask(){var t=0,h=basket.map(function(b,j){var f=bItem(b),k=Math.round(f.kcal*b.q);t+=k;

function saveMeal(){if(!basket.length){alert("Agrega al menos un alimento.");return}
  basket.forEach(function(b){var f=bItem(b);mealsToday().push({slot:mslot,name:f.name+" ("+b.q+" x "+f.por+")",kcal:Math.round(f.kcal*b.q)})});
  save();closeM();render()}

function skipMeal(slot){var d=dk();(S.skip[d]=S.skip[d]||[]).push(slot);save();closeM();render()}

function missed(){
  var out=[];if(!S.p)return out;
  for(var i=1;i<=7;i++){var d=new Date();d.setDate(d.getDate()-i);var k=dk(d);
    if(k<S.p.start)continue;
    if(S.p.days.indexOf(d.getDay())>-1){var l=S.log[k];if(!(l&&(l.finished||l.reason)))out.push(k)}}
  return out;
}
function vProg(){
  if(isKid())return vProgKid();
  var done=0,miss=0,rs=[];Object.keys(S.log).forEach(function(k){var l=S.log[k];if(l.finished)done++;if(l.reason){miss++;rs.push(k+": "+esc(l.reason))}});
  var delay=miss*Math.round(7/daysPerWeek());
  var ws=Object.keys(S.p.wlog).sort();
  return'<h2>Progreso</h2><div class="row"><div class="card"><div class="big">'+done+'</div><div class="mute">entrenos</div></div><div class="card"><div class="big">'+miss+'</div><div class="mute">faltas</div></div></div>'+
  '<div class="card"><h3>Tu meta</h3><p>'+(miss?'Entre faltas, tu meta se atrasa aprox. <b>'+delay+' días</b>. Cada sesión que sí haces te acerca.':'Vas al día. Sin faltas, tu meta no se retrasa.')+'</p>'+(rs.length?'<div class="mute">'+rs.join("<br>")+'</div>':"")+'</div>'+
  '<div class="card"><h3>Peso</h3><div class="mute">'+(ws.map(function(k){return k+": "+S.p.wlog[k]+" kg"}).join("<br>"))+'</div><label>Registrar peso de hoy (kg)</label><input id="nw" type="number" inputmode="decimal"><button class="btn alt" onclick="addW()">Guardar peso</button></div>';
}
function addW(){var v=+$("#nw").value;if(!v)return;S.p.w=v;S.p.wlog[dk()]=v;save();render()}

function closeM(){$("#modal").innerHTML=""}

function reasonFor(k){
  modal('<h3>Faltaste el '+k+'</h3><p>'+(isKid()?"No pasa nada, descansar también ayuda. ¿Qué pasó?":"Tu meta se atrasa ~"+Math.round(7/daysPerWeek())+" días por cada sesión perdida. ¿Qué pasó?")+'</p><div class="chips" style="margin-bottom:8px">'+["Sin tiempo","Cansancio","Enfermedad","Sin ganas","Viaje o trabajo"].map(function(r){return'<span class="chip" onclick="setR(\''+k+'\',\''+r+'\')">'+r+'</span>'}).join("")+'</div><input id="ro" placeholder="Otro motivo"><button class="btn" onclick="setR(\''+k+'\',$(\'#ro\').value)">Guardar motivo</button>');
}
function setR(k,r){r=(r||"").trim();if(!r){alert("Escribe un motivo.");return}S.log[k]=S.log[k]||{done:[],finished:false};S.log[k].reason=r;save();closeM();render();setTimeout(checkPrompts,300)}

var MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],cal={};

function gymState(k){var l=S.log[k];if(l&&l.finished)return"ok";if(k<S.p.start||k>=dk())return"";var d=new Date(k+"T00:00:00");return S.p.days.indexOf(d.getDay())>-1?"miss":""}

  return{tot:tot,bad:!!msg,msg:msg}}
function calCard(k){var c=cm(k),off=(new Date(c.y,c.m,1).getDay()+6)%7,n=new Date(c.y,c.m+1,0).getDate(),t=dk();
  var h='<div class="card"><h3>'+(k==="h"?"Asistencia al gym":"Calorías por día")+'</h3><div class="cal-h"><span class="chip" onclick="calNav(\''+k+'\',-1)">‹</span><b>'+MES[c.m]+' '+c.y+'</b><span class="chip" onclick="calNav(\''+k+'\',1)">›</span></div><div class="cal">'+["L","M","M","J","V","S","D"].map(function(x){return'<div class="cdh">'+x+'</div>'}).join("");

    h+='<div class="'+cls+'" onclick="calTap(\''+k+'\',\''+key+'\')">'+inner+'</div>'}

  }
